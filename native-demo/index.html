<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SO-101 Teach · 원본 앱</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:13px sans-serif;background:#132b3a;color:#fff}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:16px;padding:8px 14px;height:43px}header span{flex:1;color:#c8dce6;font-size:11px}button{border:1px solid #8ba4b1;background:#245465;color:white;padding:5px 12px;cursor:pointer}#screen{flex:1;min-height:0;background:#eaf0f4}#status{position:absolute;top:60px;left:20px;color:#142333;background:white;padding:10px;z-index:3}#status:empty{display:none}</style><header><b>원본 SO-101 Teach</b><span>Python/Tk 직접 실행 · 카메라: 오안착 사진 · 모터: 가상 장치</span><label>카메라 입력 <select id="camera"><option value="faults">오안착 사진</option><option value="complete">정상 배치 사진</option></select></label><button id="fit">원본 크기</button><button id="full">전체 화면</button></header><div id="status">원본 프로그램에 연결 중…</div><div id="screen"></div><script type="module">
import RFB from './novnc/core/rfb.js';
const status=document.querySelector('#status');const rfb=new RFB(document.querySelector('#screen'),`${location.protocol==='https:'?'wss':'ws'}://${location.host}/websockify`,{shared:true});
rfb.scaleViewport=true;rfb.resizeSession=false;rfb.showDotCursor=true;
rfb.addEventListener('connect',()=>status.textContent='');rfb.addEventListener('disconnect',()=>status.textContent='연결이 종료됐습니다. Codespace 실행 상태를 확인하고 새로고침하세요.');rfb.addEventListener('securityfailure',e=>status.textContent=e.detail.reason||'연결 오류');
document.querySelector('#camera').onchange=async e=>{const response=await fetch('./camera',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case:e.target.value})});if(!response.ok)status.textContent='사진 변경에 실패했습니다.';};
document.querySelector('#fit').onclick=e=>{rfb.scaleViewport=!rfb.scaleViewport;e.target.textContent=rfb.scaleViewport?'원본 크기':'화면 맞춤';};document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen();
</script></html>
